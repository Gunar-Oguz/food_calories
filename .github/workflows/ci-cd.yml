name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # run by hand from the Actions tab (also deploys if AWS_DEPLOY is on)

# All keys come from GitHub Secrets. Nothing secret is ever written in this file.

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -v

  # Build all three images on every push and PR, so a broken Dockerfile is caught early.
  # On main they are also pushed to Docker Hub.
  docker:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - image: food_calories
            dockerfile: Dockerfile
          - image: food_calories_etl
            dockerfile: Dockerfile.etl
          - image: food_calories_fetch
            dockerfile: Dockerfile.fetch
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t ${{ matrix.image }}:${{ github.sha }} -f ${{ matrix.dockerfile }} .
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          for tag in latest ${{ github.sha }}; do
            docker tag ${{ matrix.image }}:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:$tag
            docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:$tag
          done

  # AWS part: push to ECR, then deploy to EC2. Turned on by the repository variable AWS_DEPLOY=true
  # plus S3_BUCKET (Settings → Secrets and variables → Actions → Variables). Off by default, so CI stays green
  # while there is no AWS server; the free path is refresh-data.yml + Streamlit Community Cloud.
  push-to-ecr:
    name: Push to ECR (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && vars.AWS_DEPLOY == 'true'
    strategy:
      matrix:
        include:
          - image: food_calories
            dockerfile: Dockerfile
          - image: food_calories_etl
            dockerfile: Dockerfile.etl
          - image: food_calories_fetch
            dockerfile: Dockerfile.fetch
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        run: |
          docker build --platform linux/amd64 -t ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}:latest -f ${{ matrix.dockerfile }} .
          docker push ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: push-to-ecr
    steps:
      - name: Restart the dashboard and schedule the batch jobs
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,S3_BUCKET,REGISTRY
          script: |
            set -e
            # Keys live in a private env file on the server (owner-only), never in the crontab or in git.
            umask 077
            printf 'AWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\nAWS_DEFAULT_REGION=%s\nS3_BUCKET=%s\n' \
              "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_REGION" "$S3_BUCKET" > ~/food.env
            mkdir -p ~/etl-logs

            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
            for image in food_calories food_calories_etl food_calories_fetch; do
              docker pull "$REGISTRY/$image:latest"
            done

            docker rm -f streamlit-app || true
            docker run -d -p 8501:8501 --env-file ~/food.env --restart unless-stopped \
              --name streamlit-app "$REGISTRY/food_calories:latest"

            # 10:00 fetch from the API, 10:15 run the ETL (server time, UTC)
            (crontab -l 2>/dev/null | grep -v "food_calories_" ;
             echo "0 10 * * * docker run --rm --env-file $HOME/food.env $REGISTRY/food_calories_fetch:latest >> $HOME/etl-logs/fetch.log 2>&1" ;
             echo "15 10 * * * docker run --rm --env-file $HOME/food.env $REGISTRY/food_calories_etl:latest >> $HOME/etl-logs/etl.log 2>&1") | crontab -
